services:
  mysql:
    image: mysql:8.0
    container_name: sportsbooking-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-292929}
    ports:
      - "3307:3306"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-292929}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    container_name: sportsbooking-auth
    restart: on-failure
    ports:
      - "5001:5001"
    environment:
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=miniproject_auth;User=root;Password=${MYSQL_ROOT_PASSWORD:-292929}
      Jwt__Key: ${JWT_KEY:-super-secret-key-min-32-bytes-long!!}
      Jwt__Issuer: SportsBookingAuth
      Jwt__Audience: SportsBookingClients
    depends_on:
      mysql:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
    container_name: sportsbooking-catalog
    restart: on-failure
    ports:
      - "5002:5002"
    environment:
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=miniproject_catalog;User=root;Password=${MYSQL_ROOT_PASSWORD:-292929}
      Jwt__Key: ${JWT_KEY:-super-secret-key-min-32-bytes-long!!}
      Jwt__Issuer: SportsBookingAuth
      Jwt__Audience: SportsBookingClients
    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: src/BookingService/Dockerfile
    container_name: sportsbooking-booking
    restart: on-failure
    ports:
      - "5003:5003"
    environment:
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=miniproject_booking;User=root;Password=${MYSQL_ROOT_PASSWORD:-292929}
      Services__CatalogUrl: http://catalog-service:5002
      Jwt__Key: ${JWT_KEY:-super-secret-key-min-32-bytes-long!!}
      Jwt__Issuer: SportsBookingAuth
      Jwt__Audience: SportsBookingClients
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: sportsbooking-gateway
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      Gateway__AuthHost: auth-service
      Gateway__AuthPort: 5001
      Gateway__CatalogHost: catalog-service
      Gateway__CatalogPort: 5002
      Gateway__BookingHost: booking-service
      Gateway__BookingPort: 5003
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      booking-service:
        condition: service_started

volumes:
  mysql-data:
